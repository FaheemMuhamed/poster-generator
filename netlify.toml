# Netlify builds a preview link for every pull request (and branch).
# The official live site is still GitHub Pages, deployed from main.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# GitHub Pages can't send headers (the CSP there is a <meta> tag added at build time);
# Netlify previews can, so they get the rest.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
